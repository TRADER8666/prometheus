services:
  backend:
    build: ./backend
    container_name: prometheus-backend
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - SEARXNG_URL=http://searxng:8080
      - DB_PATH=/data/prometheus.db
      - WORKSPACE_ROOT=/workspace
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - chromadb
      - searxng
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: prometheus-frontend
    environment:
      - VITE_API_URL=/api
    ports:
      - "3000:3000"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: prometheus-chromadb
    volumes:
      - ./chroma_data:/chroma/chroma
    ports:
      - "8001:8000"
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: prometheus-searxng
    environment:
      - BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "8080:8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: prometheus-nginx
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    restart: unless-stopped

networks:
  default:
    name: prometheus-net
